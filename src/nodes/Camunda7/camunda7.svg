<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FC5D0D"/>

  <!-- Camunda-style workflow icon -->
  <g fill="white">
    <!-- Start event (circle) -->
    <circle cx="16" cy="32" r="6" fill="none" stroke="white" stroke-width="2"/>

    <!-- Task (rectangle) -->
    <rect x="26" y="26" width="12" height="12" rx="2" fill="none" stroke="white" stroke-width="2"/>

    <!-- End event (bold circle) -->
    <circle cx="48" cy="32" r="6" fill="none" stroke="white" stroke-width="3"/>

    <!-- Connecting arrows -->
    <line x1="22" y1="32" x2="26" y2="32" stroke="white" stroke-width="2"/>
    <line x1="38" y1="32" x2="42" y2="32" stroke="white" stroke-width="2"/>
  </g>
</svg>
